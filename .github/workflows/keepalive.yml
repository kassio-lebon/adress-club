name: Garder ADRESS CLUB actif

# Le plan gratuit de Supabase met le projet en pause après 7 jours sans activité.
# Ce robot appelle la base tous les 2 jours (fonction ping, qui ne lit aucune donnée).
# En cas d'échec 3 fois de suite, GitHub envoie un e-mail au propriétaire du dépôt.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveil de la base Supabase
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://xvevjlovjpeqfpzfihrj.supabase.co/rest/v1/rpc/ping" \
              -H "apikey: sb_publishable_oPj4LrfV0uvN95MmpTPl8A_x5XLxVcj" -H "Content-Type: application/json" -d '{}')
            echo "Réponse de la base : $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "La base ne répond pas : vérifier le tableau de bord Supabase (projet en pause ?)"
          exit 1
      - name: Garder ce robot actif (GitHub le coupe après 60 jours sans modification du dépôt)
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
